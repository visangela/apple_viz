name: Sync Apple Timeline Agent

on:
  schedule:
    # 每天 UTC 01:00 运行（北京时间 09:00）
    # GitHub Actions 的 cron 使用 UTC，不支持时区后缀
    - cron: '0 1 * * *'
  workflow_dispatch:      # 允许手动触发，用于测试

permissions:
  contents: write         # 允许 Actions 向仓库提交 events.json

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main        # 如果你的默认分支叫 master，改成 master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run agent sync
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/sync-agent.mjs

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: auto-sync apple timeline events [skip ci]"
          git push